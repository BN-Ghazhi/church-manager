# Builds installable packages for Windows and Linux.
#
# The Windows job exists because Flutter cannot cross-compile desktop targets —
# a .exe has to be produced on Windows, and this provides one without needing a
# Windows machine to hand.
#
# To run it: Actions tab → "Build" → "Run workflow". It also runs on every push
# to master or dev. Finished builds appear under the run's "Artifacts".

name: Build

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Runs first and gates the builds: if the tests fail there is no point
  # producing installers.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Generated Drift code is committed, so regenerate over the top rather
      # than failing on conflicting outputs.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release

      # The raw build: churchms.exe plus the DLLs and data/ directory it needs
      # beside it. This one does NOT install anything — it just runs from the
      # folder. Named to say so, because "portable" was mistaken for the
      # installer and led to "it only runs, it does not install".
      - name: Upload portable build (runs without installing)
        uses: actions/upload-artifact@v4
        with:
          name: RUNS-WITHOUT-INSTALLING-windows-folder
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      # Inno Setup turns that folder into a single setup.exe. It is not part of
      # the runner image by default, so install it rather than assuming.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup not found at $iscc"
          }
          & $iscc "packaging\windows-installer.iss"
        shell: pwsh

      # Proves the installer installs, rather than trusting that it compiled.
      # Runs it silently, then asserts the app landed on disk, the Start Menu
      # and desktop shortcuts exist, and Windows registered an uninstaller.
      # A setup .exe that merely unpacks and runs would fail here.
      - name: Verify the installer actually installs
        run: |
          $setup = Get-ChildItem dist\*.exe | Select-Object -First 1
          Write-Host "Running $($setup.Name) silently..."
          # /SILENT with the desktop-icon task, then wait for it to finish.
          Start-Process -FilePath $setup.FullName `
            -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' `
            -Wait

          $app = Join-Path $env:ProgramFiles 'Church Management\churchms.exe'
          if (-not (Test-Path $app)) {
            throw "NOT INSTALLED: expected $app"
          }
          Write-Host "installed:  $app"

          $startMenu = Join-Path $env:ProgramData `
            'Microsoft\Windows\Start Menu\Programs\Church Management\Church Management.lnk'
          if (-not (Test-Path $startMenu)) {
            throw "NO START MENU SHORTCUT: expected $startMenu"
          }
          Write-Host "start menu: $startMenu"

          $desktop = Join-Path $env:PUBLIC 'Desktop\Church Management.lnk'
          if (-not (Test-Path $desktop)) {
            throw "NO DESKTOP SHORTCUT: expected $desktop"
          }
          Write-Host "desktop:    $desktop"

          # Registered for Add/Remove Programs, so it can be uninstalled.
          $key = Get-ChildItem `
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' `
            -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ItemProperty $_.PSPath } |
            Where-Object { $_.DisplayName -eq 'Church Management' }
          if (-not $key) {
            throw "NOT REGISTERED in Add/Remove Programs"
          }
          Write-Host "uninstall:  $($key.UninstallString)"

          # The shortcut must carry the app icon, not a generic one. Checking
          # the path is not enough — an exe with no icon resource still yields a
          # path, and Windows then draws its blank default. So extract the icon
          # and assert it is really there and non-trivial.
          $shell = New-Object -ComObject WScript.Shell
          $lnk = $shell.CreateShortcut($desktop)
          Write-Host "icon path:  $($lnk.IconLocation)"
          if (-not $lnk.IconLocation.ToLower().Contains('churchms.exe')) {
            throw "SHORTCUT ICON WRONG: $($lnk.IconLocation)"
          }

          Add-Type -AssemblyName System.Drawing
          # Resolve the icon the way Explorer does for the shortcut's target,
          # rather than reading the .ico file we shipped — this is what the user
          # actually sees on the desktop.
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon($lnk.TargetPath)
          if (-not $ico) { throw "NO ICON for $($lnk.TargetPath)" }
          Write-Host "resolved:   $($lnk.TargetPath)"
          Write-Host "icon size:  $($ico.Width)x$($ico.Height)"

          # A real multi-size .ico is several KB. A missing or placeholder icon
          # comes out tiny, so this catches a silently-lost icon resource.
          $bmp = $ico.ToBitmap()
          $ms = New-Object System.IO.MemoryStream
          $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "icon bytes: $($ms.Length)"
          if ($ms.Length -lt 500) {
            throw "ICON LOOKS EMPTY: only $($ms.Length) bytes"
          }

          # Prove the icon is OURS and not Flutter's default. Measured on both
          # images: ours is a white cross on a near-black square (79% dark
          # pixels, 0% blue); Flutter's is a blue logo on transparency (0% dark,
          # 30% blue). A centre-pixel sample does NOT separate them, because the
          # Flutter logo's centre is transparent — so count pixels instead.
          $dark = 0; $blue = 0; $total = $bmp.Width * $bmp.Height
          for ($x = 0; $x -lt $bmp.Width; $x++) {
            for ($y = 0; $y -lt $bmp.Height; $y++) {
              $c = $bmp.GetPixel($x, $y)
              if ($c.A -gt 200) {
                if ($c.R -lt 60 -and $c.G -lt 60 -and $c.B -lt 60) { $dark++ }
                if ($c.B -gt $c.R + 40) { $blue++ }
              }
            }
          }
          $darkPct = [int]($dark * 100 / $total)
          $bluePct = [int]($blue * 100 / $total)
          Write-Host "icon dark:  $darkPct% (ours ~79%, Flutter's 0%)"
          Write-Host "icon blue:  $bluePct% (ours 0%, Flutter's ~30%)"
          if ($bluePct -gt 10) {
            throw "THIS IS FLUTTER'S DEFAULT ICON, not the church icon"
          }
          if ($darkPct -lt 40) {
            throw "ICON IS NOT THE CHURCH ICON (expected a dark square)"
          }

          # No Flutter branding anywhere a user can see. The window class name
          # is the sneaky one: Windows keys the taskbar icon and pinning on it,
          # and Flutter's default is shared by every Flutter app on the machine.
          $exeBytes = [System.IO.File]::ReadAllBytes($app)
          $text = [System.Text.Encoding]::Unicode.GetString($exeBytes)
          if ($text -match 'FLUTTER_RUNNER_WIN32_WINDOW') {
            throw "EXE STILL USES FLUTTER'S WINDOW CLASS - taskbar icon may show Flutter's"
          }
          if ($text -notmatch 'KGC_CHURCH_MANAGEMENT_WINDOW') {
            throw "OUR WINDOW CLASS IS MISSING from the exe"
          }
          Write-Host "win class:  KGC_CHURCH_MANAGEMENT_WINDOW (not Flutter's)"

          Write-Host ""
          Write-Host "Installer verified: installs to Program Files, shortcuts"
          Write-Host "created with the app icon, uninstaller registered,"
          Write-Host "no Flutter branding."
        shell: pwsh

      # This is the one to download. It installs to Program Files, adds Start
      # Menu and desktop shortcuts, and registers an uninstaller.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: INSTALLER-windows-setup-exe
          path: dist/*.exe
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - name: Package .deb
        run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: church-management-linux-deb
          path: dist/*.deb
          if-no-files-found: error
