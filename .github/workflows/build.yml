# Builds installable packages for Linux and Windows.
#
# The Windows job exists because Flutter cannot cross-compile desktop targets —
# a .exe has to be produced on Windows, and this provides one without needing a
# Windows machine to hand.
#
# Run it from the Actions tab, or on any push to main. Finished builds appear
# under the run's "Artifacts".

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - name: Package .deb
        run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: church-management-linux-deb
          path: dist/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build windows --release
      - name: Build installer
        # Inno Setup ships on the GitHub Windows runners.
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows-installer.iss
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: church-management-windows-setup
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: church-management-windows-portable
          path: build/windows/x64/runner/Release/
